      (function() {
        // Protect against environments where window.fetch has only a getter
        try {
          var _origFetch = typeof window !== 'undefined' && typeof window.fetch === 'function' 
            ? window.fetch.bind(window) 
            : null;
          var _currentFetch = _origFetch;

          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || 
                     (typeof Window !== 'undefined' && Object.getOwnPropertyDescriptor(Window.prototype, 'fetch'));
          
          if (!desc || (desc.get && !desc.set) || desc.configurable) {
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() { return _currentFetch || _origFetch; },
                set: function(fn) { _currentFetch = fn; },
                configurable: true,
                enumerable: true
              });
            } catch (e1) {
              try {
                if (typeof Window !== 'undefined' && Window.prototype) {
                  Object.defineProperty(Window.prototype, 'fetch', {
                    get: function() { return _currentFetch || _origFetch; },
                    set: function(fn) { _currentFetch = fn; },
                    configurable: true,
                    enumerable: true
                  });
                }
              } catch (e2) {}
            }
          }
        } catch (e) {}

        if (typeof window !== 'undefined') {
          window.addEventListener('error', function(event) {
            if (event && event.message && event.message.indexOf('Cannot set property fetch of') !== -1) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return true;
            }
          }, true);
        }
      })();
