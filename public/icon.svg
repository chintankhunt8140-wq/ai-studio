<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#1e1435" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#accentGrad)" opacity="0.22" filter="url(#glow)" />

  <!-- Cinema Frame / Sparkle Core -->
  <g transform="translate(256, 256)">
    <!-- Outer Aperture Ring -->
    <circle r="120" fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="140 30 90 25" />
    
    <!-- Inner Sparkle 4-point Star (AI Brain) -->
    <path d="M 0,-85 Q 0,0 85,0 Q 0,0 0,85 Q 0,0 -85,0 Q 0,0 0,-85 Z" fill="url(#primaryGrad)" filter="url(#glow)" />
    
    <!-- Center Radiant Core -->
    <circle r="22" fill="#ffffff" />
    <circle r="10" fill="#38bdf8" />

    <!-- Video Play / Film Accent -->
    <polygon points="60,-70 95,-50 60,-30" fill="#38bdf8" opacity="0.9" />
    <polygon points="-60,70 -95,50 -60,30" fill="#c084fc" opacity="0.9" />
  </g>
</svg>
