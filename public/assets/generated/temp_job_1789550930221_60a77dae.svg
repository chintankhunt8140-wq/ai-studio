<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="cinematicGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75" />
    </linearGradient>
    <radialGradient id="lensFlare" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)" />
  
  <rect width="1280" height="720" fill="url(#lensFlare)" />

  <!-- Ambient Light Streak / Horizon line -->
  <line x1="0" y1="396.00000000000006" x2="1280" y2="396.00000000000006" stroke="#f8fafc" stroke-width="1.5" stroke-opacity="0.4" filter="url(#softGlow)" />

  <!-- Geometric / Subject Focal Silhouette -->
  <g transform="translate(640, 360)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="158.4" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-opacity="0.6" />
    <circle cx="0" cy="0" r="129.6" fill="#0f172a" fill-opacity="0.5" stroke="#06b6d4" stroke-width="1" />
  </g>

  <!-- Atmospheric cinematic particles -->
  <circle cx="256" cy="216" r="3.5" fill="#f8fafc" opacity="0.8" />
  <circle cx="512" cy="180" r="2" fill="#f8fafc" opacity="0.6" />
  <circle cx="960" cy="251.99999999999997" r="4" fill="#f8fafc" opacity="0.85" />
  <circle cx="768" cy="468" r="2.5" fill="#f8fafc" opacity="0.7" />

  <!-- Cinema Letterbox / UI Overlay -->
  <rect x="28" y="28" width="80" height="26" rx="6" fill="#000000" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.2" />
  <text x="68" y="45" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="12" font-weight="bold">● REC</text>

  <rect x="1150" y="28" width="102" height="26" rx="6" fill="#000000" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.2" />
  <text x="1201" y="45" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="12">10.0s • 24FPS</text>

  <!-- Lower Third Info -->
  <rect x="28" y="644" width="1224" height="48" rx="10" fill="#000000" fill-opacity="0.65" stroke="#ffffff" stroke-opacity="0.15" />
  <text x="48" y="674" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">
    AI STUDIO VIDEO • Steadicam tracking shot with smooth linear motion
  </text>
  <text x="1232" y="674" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="12">
    1080p Master • AI Orchestrated
  </text>
</svg>